{% extends 'teams/base.html' %}
{% block title %}Register - TKMcric{% endblock %}
{% block content %}
    <h1>Create Account</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <a href="{% url 'login' %}">Already have an account? Login</a>
{% endblock %}
