{% extends 'teams/base.html' %}
{% block title %}Teams - TKMcric{% endblock %}
{% block content %}
    <h1>All Teams</h1>
    <a href="{% url 'team_create' %}">+ Add Team</a>
    <ul>
        {% for team in teams %}
            <li><a href="{% url 'team_detail' team.pk %}">{{ team.name }} ({{ team.short_name }})</a></li>
        {% empty %}
            <li>No teams yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
