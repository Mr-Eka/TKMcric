{% extends 'teams/base.html' %}
{% block title %}Add Team - TKMcric{% endblock %}
{% block content %}
    <h1>Add a Team</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
    <a href="{% url 'team_list' %}">Cancel</a>
{% endblock %}
