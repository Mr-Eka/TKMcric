{% extends 'teams/base.html' %}
{% block title %}{% if editing %}Edit Player{% else %}Add Player{% endif %} - TKMcric{% endblock %}
{% block content %}
    <h1>{% if editing %}Edit Player{% else %}Add Player to {{ team.name }}{% endif %}</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
    <a href="{% url 'team_detail' team.pk %}">Cancel</a>
{% endblock %}
