{% extends 'teams/base.html' %}
{% block title %}Add Player - TKMcric{% endblock %}
{% block content %}
    <h1>Add Player to {{ team.name }}</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
    <a href="{% url 'team_detail' team.pk %}">Cancel</a>
{% endblock %}
